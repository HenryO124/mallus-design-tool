<title>Mallu's Design Tool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Työpöytä: ylävalikko, alla kirjasto | pohja | 3D | ominaisuudet. Graafiittinen harmaa + piirustussininen korostus. */
:root{
  --bg:#e7eae8; --panel:#f7f8f7; --panel-2:#eef1ef; --ink:#1b2220; --ink-2:#5a6561; --line:#cfd5d2;
  --accent:#2e5c8a; --accent-ink:#ffffff; --accent-soft:#dbe5ef; --danger:#a8402f; --ok:#2c7a4b; --ok-soft:#dcefe3; --bad-soft:#f6e0db;
  --plan-bg:#fbfcfb; --grid:#e6eae8; --grid-major:#cdd4d1; --wall:#2a302e; --view3d:#dde1df;
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121615; --panel:#1a1f1e; --panel-2:#222826; --ink:#e3e8e6; --ink-2:#97a39e; --line:#2e3533;
  --accent:#86afd9; --accent-ink:#0e1824; --accent-soft:#22313f; --danger:#e07a66; --ok:#6cc08b; --ok-soft:#1d3326; --bad-soft:#3a231e;
  --plan-bg:#161b1a; --grid:#1f2523; --grid-major:#2c3431; --wall:#d4dbd8; --view3d:#1c2120; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --panel:#1a1f1e; --panel-2:#222826; --ink:#e3e8e6; --ink-2:#97a39e; --line:#2e3533;
  --accent:#86afd9; --accent-ink:#0e1824; --accent-soft:#22313f; --danger:#e07a66; --ok:#6cc08b; --ok-soft:#1d3326; --bad-soft:#3a231e;
  --plan-bg:#161b1a; --grid:#1f2523; --grid-major:#2c3431; --wall:#d4dbd8; --view3d:#1c2120; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;min-height:100%}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.filebtns{display:flex;gap:4px;align-self:center}.filebtns .btn{padding:4px 9px}#dirtyMark{color:var(--accent);font-size:11px;align-self:center}
.pdfopts{display:grid;gap:8px;margin:10px 0}.pdfopt{display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-size:13px}.pdfopt span{display:grid}.pdfopt input{margin-top:3px;accent-color:var(--accent)}
.prjList{display:grid;gap:6px;max-height:52vh;overflow:auto;margin:8px 0}.prjRow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:6px}.prjRow.cur{border-color:var(--accent);background:var(--accent-soft)}.prjRow img,.prjRow .noimg{width:96px;height:64px;object-fit:cover;border-radius:4px;background:var(--panel-2)}.prjRow .acts{margin:0;flex-wrap:nowrap}
.measbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;box-shadow:0 6px 18px rgba(0,0,0,.15);font-size:13px;z-index:5;white-space:nowrap}.measbar b{font-family:var(--f-mono);font-size:14px}.measbar .small{margin:0}
.optbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:5px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.optbar .og{display:inline-flex;align-items:center;gap:4px 10px;flex-wrap:wrap;padding-right:12px;border-right:1px solid var(--line)}.optbar .og:last-child{border-right:0}.optbar .og>b{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:-4px}
.optbar label{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}.optbar input{accent-color:var(--accent);margin:0}
.viewmenu{position:relative;align-self:center;margin-left:6px}.viewmenu>summary{list-style:none;cursor:pointer}.viewmenu>summary::-webkit-details-marker{display:none}
.viewmenu>summary::after{content:' ▾';font-size:10px}#vmCount:not(:empty){margin-left:5px;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 6px;font-size:11px}
.vmpop{position:absolute;top:calc(100% + 6px);left:0;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px 12px;display:grid;gap:8px;min-width:250px;font-size:13px}
.vmpop label{display:flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}.vmpop input{accent-color:var(--accent);margin:0}
body.hide-price .price{display:none!important}
body.hide-qty #tabs [data-tab="qty"],body.hide-qty #tab-qty,body.hide-qty #live,body.hide-qty .qtyinfo{display:none!important}

.brand b{font-weight:600;font-size:15px;letter-spacing:.01em}
.brand .proj{color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{width:14px;height:14px;border:2px solid var(--accent);border-radius:2px;align-self:center;position:relative;flex:none}
.mark::after{content:"";position:absolute;inset:3px 0 0 3px;border-top:2px solid var(--accent);border-left:2px solid var(--accent)}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.group+.group{padding-left:14px;border-left:1px solid var(--line)}
.btn{padding:6px 11px;border:1px solid var(--line);background:var(--panel-2);border-radius:5px;cursor:pointer;font-size:13px;font-weight:500;line-height:1.25;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn:focus-visible,.tabs button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.libi:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.icon{width:32px;padding-inline:0;text-align:center}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;background:var(--panel-2);padding:6px 10px;cursor:pointer;font-size:13px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.work{flex:1;display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr) 340px;gap:12px;min-height:0;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.work{grid-template-columns:var(--cols,200px minmax(0,1fr) minmax(0,1fr) 340px)!important}.work .hidepane{display:none!important}kbd.kc{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--panel);font:600 12px var(--f-mono);white-space:nowrap}.aihint{margin:8px 0;padding:10px 12px;border-radius:8px;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel));font-size:13px;line-height:1.5}.aihint ol{margin:6px 0 0;padding-left:20px}.zbar{display:inline-flex;gap:4px;padding:2px 6px;margin-right:6px;border-radius:8px;background:color-mix(in srgb,var(--accent) 14%,transparent)}.work.tabmode{grid-template-columns:minmax(0,1fr)!important}.work.tabmode>.tabhide{display:none!important}.work.tabmode>.pane,.work.tabmode>.lib,.work.tabmode>.side{height:var(--tabh,70vh)!important;max-height:none!important;min-height:320px!important}.work.tabmode>.lib,.work.tabmode>.side{overflow:auto}#tabModeBtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.work.swap .planp{order:3}.work.swap .viewp{order:2}.work .lib{order:1}.work .planp{order:2}.work .viewp{order:3}.work .side{order:4}




.pane{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--plan-bg);min-width:0;min-height:0}
.pane-h{display:flex;gap:12px;align-items:baseline;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12px}
.pane-h b{font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.pane-h .hint{color:var(--ink-2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane-h .coords{font-family:var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.stage{position:relative;flex:1;min-height:0}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#three{position:absolute;inset:0}
.floorbar{display:inline-flex;gap:3px;align-items:center;margin:0 8px;flex-wrap:wrap}.floorbar .btn{padding:2px 8px;font-size:12px;min-height:0}.floorbar select{font:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:inherit}
.walkbar{position:absolute;left:10px;top:10px;max-width:calc(100% - 20px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.14);z-index:6;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.walkbar input{width:62px;font:inherit;padding:2px 4px;border:1px solid var(--line);border-radius:6px}
.joy{position:absolute;left:16px;bottom:64px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(0,0,0,.18);z-index:6;touch-action:none}.joy i{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(46,92,138,.75)}
.hbtn{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--accent);font:700 11px/1 sans-serif;cursor:pointer;margin:0 6px;padding:0;vertical-align:middle}.hbtn:hover{background:var(--accent);color:#fff}
.helpdlg{display:grid;grid-template-columns:180px 1fr;gap:16px;max-width:860px;width:min(860px,94vw);max-height:84vh}.helpdlg nav{display:grid;gap:2px;align-content:start;overflow:auto}.helpdlg nav button{text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;font:inherit;color:inherit;cursor:pointer}.helpdlg nav button.on{background:var(--accent);color:#fff}.helpdlg .hc{overflow:auto;max-height:76vh;padding-right:6px;line-height:1.55}.helpdlg .hc h3{margin:0 0 8px}.helpdlg .hc h4{margin:14px 0 4px}.helpdlg .hc li{margin:3px 0}.helpdlg kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:12px var(--f-mono);background:var(--panel)}
@media(max-width:640px){.helpdlg{grid-template-columns:1fr}.helpdlg nav{grid-auto-flow:column;overflow-x:auto}}
.lightp{position:absolute;right:10px;top:10px;width:290px;max-height:calc(100% - 64px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.14);z-index:6}
.lightp h3{font-size:12px;margin:0 0 6px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}.lightp .r{display:flex;align-items:center;gap:6px;margin:6px 0;flex-wrap:wrap}.lightp label{display:flex;align-items:center;gap:6px}
.lightp input[type=range]{flex:1;min-width:120px}.lightp select,.lightp input[type=number],.lightp input[type=date]{font:inherit;padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--bg,#fff);color:inherit}.lightp .info{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);line-height:1.5}
.float{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.float .btn{background:var(--panel)}
.float .btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.side,.lib{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;background:var(--panel);min-height:0;min-width:0}
.lib-h{padding:10px 10px 8px;border-bottom:1px solid var(--line);display:grid;gap:7px}
.lib-h b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.lib-h input{width:100%;border:1px solid var(--line);border-radius:4px;background:var(--plan-bg);padding:5px 8px;font-size:13px}
#libTree{overflow:auto;flex:1;padding:4px 4px 16px}
.lp{display:flex;flex-direction:column;flex:1;min-height:0}.lp[hidden]{display:none}
#objTree{overflow:auto;flex:1;padding:4px 4px 16px}
#objPath{padding:10px 10px 8px;border-bottom:1px solid var(--line)}
.crumb{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}
.crumb li{display:grid;grid-template-columns:1fr;gap:1px;padding:4px 8px;border-radius:4px;position:relative}
.crumb li .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.crumb li .v{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb li .v small{color:var(--ink-2);font-size:11px;margin-left:5px}
.crumb li.go{cursor:pointer}.crumb li.go:hover{background:var(--panel-2)}
.crumb li.cur{background:var(--accent-soft)}.crumb li.cur .v{font-weight:600}
.crumb li+li::before{content:"";position:absolute;left:-2px;top:-6px;height:12px;border-left:1px solid var(--line)}
.objT .cat .cat{margin-left:2px}.objT .cat .cat>summary{font-weight:500;font-size:12.5px;padding:5px 6px}
.objT .olist{padding-left:8px}
.objT .olist li>.row{display:grid!important;grid-template-columns:1fr;gap:0;padding:4px 6px}
.objT .olist li>.row .n{order:1;white-space:normal;overflow:visible}
.objT .olist li>.row .t{order:2;min-width:0!important;margin-left:0!important;font-size:11px;color:var(--ink-2);white-space:normal}
.objT .olist .sub{margin-left:8px}
.objT .sub li.det>.row{cursor:pointer;color:var(--ink)}.objT .sub li.det.on>.row{background:var(--accent-soft)}
.cat>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:7px 6px;font-weight:600;font-size:13px;border-radius:4px}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary::before{content:"";width:0;height:0;border-left:5px solid var(--ink-2);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .12s}
.cat[open]>summary::before{transform:rotate(90deg)}
.cat>summary span{margin-left:auto;font-weight:400;color:var(--ink-2);font-size:11px;font-family:var(--f-mono)}
.cat>summary:hover{background:var(--panel-2)}
.cat ul{list-style:none;margin:0 0 4px;padding:0 0 0 14px}
.cat .subs{padding:0 0 4px 10px}
.cat.sub>summary{font-weight:500;font-size:12.5px;padding:5px 6px}
.cat.sub ul{padding-left:12px;border-left:1px solid var(--line);margin-left:8px}
.libi.addimg{font-size:12px;opacity:.85}
.libi .msw{width:22px;height:22px;border-radius:4px;flex:none;background-size:cover;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.libi.mat.cur{background:var(--accent-soft);font-weight:600}
.medit:hover{color:var(--accent)!important;background:var(--accent-soft)!important}
.fitsub>summary{color:var(--accent)}
.mdPrev{width:120px;height:120px;border-radius:6px;background:var(--panel-2) center/cover;box-shadow:inset 0 0 0 1px var(--line)}
.mdTint{height:10px;border-radius:3px;margin-top:6px}
.fdres{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;margin:12px 0;padding:10px;border:1px solid var(--line);border-radius:6px}.fdres img{width:96px;height:96px;object-fit:contain;background:var(--panel-2);border-radius:4px}
.usegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 12px;font-size:13px}
.usegrid label{display:flex;gap:6px;align-items:center}
.libi{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:4px;cursor:grab;font-size:13px;color:var(--ink)}
.libi:hover{background:var(--accent-soft)}
.libi.tool{color:var(--accent);font-weight:500;cursor:pointer}
.cat li.le{display:flex;align-items:center;gap:3px}.libi.le{display:flex;align-items:center;gap:7px;min-width:0;flex:1}.libi.le img{width:28px;height:28px;object-fit:contain;border-radius:3px;background:var(--panel-2);flex:none}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1;border:0;background:none;padding:10px 5px;cursor:pointer;font-size:12px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab{flex:1;overflow:auto;padding:14px 14px 24px;min-height:0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.name{width:100%;font-size:16px;font-weight:600;border:1px solid transparent;background:none;padding:3px 4px;margin:2px -4px 6px;border-radius:4px}
.name:hover{border-color:var(--line)}
.sec{margin:16px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600;border-top:1px solid var(--line);padding-top:12px}
.f{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:8px;align-items:center;margin:5px 0}
.f label{color:var(--ink);font-size:13px}
.f .in{display:flex;align-items:center;border:1px solid var(--line);border-radius:4px;background:var(--plan-bg);overflow:hidden}
.f .in input,.mods input{width:100%;border:0;background:none;padding:5px 6px;text-align:right;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;min-width:0}
.f .in input.txt{text-align:left;font-family:var(--f-sans)}
.f .in span{padding:0 7px 0 0;color:var(--ink-2);font-size:11px;font-family:var(--f-mono)}
.f select,.mods select,.chk-form select{width:100%;padding:5px;border:1px solid var(--line);border-radius:4px;background:var(--plan-bg);font-size:13px;min-width:0}

.f.mat{grid-template-columns:minmax(0,1fr) 150px}
.matsel{display:flex;gap:6px;align-items:center;min-width:0}
.sw{width:22px;height:22px;border-radius:3px;border:1px solid var(--line);flex:none;background-size:cover;background-position:center}
.chk{display:flex;justify-content:flex-end}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.note{margin:10px 0;padding:9px 10px;border-radius:5px;background:var(--accent-soft);font-size:12.5px;line-height:1.5;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.note.warn{background:var(--bad-soft)}
.empty{color:var(--ink-2);line-height:1.55;margin:0 0 6px;max-width:60ch}

.corners svg{display:block;max-width:100%;height:auto}
.opd{border:1px solid var(--line);border-radius:5px;margin:6px 0;background:var(--plan-bg)}
.opd>summary{cursor:pointer;padding:7px 10px;font-weight:500;font-size:13px;display:flex;gap:8px;align-items:baseline}
.opd>summary span{color:var(--ink-2);font-family:var(--f-mono);font-size:11.5px;margin-left:auto}
.opd[open]>summary{border-bottom:1px solid var(--line)}
.opd .body{padding:4px 10px 8px}
.opd.on{border-color:var(--accent)}
.mods{display:grid;gap:5px;margin:6px 0}
.mods .row{display:grid;grid-template-columns:minmax(0,1.4fr) 66px 42px 66px 22px;gap:4px;align-items:center}
.ptree{list-style:none;margin:0 0 6px;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}

  const i=(y*w+X)*4,j=horiz?(y*w+(X+(w>>1))%w)*4:(((y+(h>>1))%h)*w+X)*4;for(let k=0;k<4;k++)o[i+k]=d[i+k]*(1-t)+d[j+k]*t}return o}

const HELP=[
 ['alku','Aloitus',`<h3>Näin pääset alkuun</h3><ol><li><b>Huone:</b> paina oikeasta yläkulmasta <b>Uusi huone</b> ja vedä suorakaide 2D-pohjaan, tai <b>Piirrä seinä</b> ja klikkaa seinän kulmat (kaksoisklikkaus lopettaa).</li><li><b>Ovet ja ikkunat:</b> <b>Ovi</b> tai <b>Ikkuna</b> ja klikkaa seinää.</li><li><b>Kalusteet:</b> klikkaa kirjastosta (vasemmalla), niin kohde tulee näkymän keskelle, tai vedä se 2D- tai 3D-näkymään.</li><li><b>Muokkaa:</b> valitse kohde, niin oikealle tulevat sen <b>Ominaisuudet</b>: mitat, materiaalit ja osat (Rakenne-lista).</li><li><b>Tallenna:</b> <b>Tallenna</b> tai <kbd>Ctrl</kbd>+<kbd>S</kbd>.</li></ol><p>Paneelit (Kirjasto, 2D, 3D, Ominaisuudet) voi piilottaa ja vaihtaa ylärivin painikkeista. Jokaisen näkymän otsikossa oleva <b>?</b> avaa tämän ohjeen oikeasta kohdasta.</p>`],
 ['2d','2D-pohja',`<h3>2D-pohja</h3><ul><li><b>Valitse:</b> klikkaa kohdetta. <b>Siirrä:</b> vedä. <b>Kierrä:</b> <kbd>R</kbd> tai Kierrä 90°.</li><li><b>Koon muutos:</b> vedä valitun kohteen reunassa olevista kahvoista. Reunat kohdistuvat viereisiin kalusteisiin ja seiniin (<kbd>Alt</kbd> ohittaa kohdistuksen).</li><li><b>Liikkuminen:</b> rulla zoomaa, vedä tyhjästä kohdasta siirtääksesi, ⟲ ⟳ kääntää pohjaa.</li><li><b>Mittaa:</b> Mittaa-työkalu (<kbd>M</kbd>), klikkaa kaksi pistettä, <kbd>Enter</kbd> tallentaa mittaviivan.</li><li><b>Kompassi:</b> vedä vasemman yläkulman nuolta, niin pohjoinen kääntyy (kaksoisklikkaus palauttaa).</li><li><b>Kerrokset:</b> pohjan otsikkorivin kerrospainikkeet, + lisää kerroksen ja ⚙ avaa asetukset.</li><li><b>Pohjakuva:</b> lataa piirustus kuvana tai DXF:nä taustaksi (Pohjakuva-painike).</li></ul>`],
 ['3d','3D ja kävely',`<h3>3D-näkymä</h3><ul><li><b>Kierrä:</b> vedä. <b>Siirrä:</b> oikea painike tai kaksi sormea. <b>Zoomaa:</b> rulla.</li><li><b>Seinä 1–4:</b> katso seinää suoraan edestä. <b>Perspektiivi</b> palauttaa yleisnäkymän.</li><li><b>Ovet ja laatikot:</b> yksittäisen oven, laatikon tai portin saa auki <b>kaksoisklikkaamalla</b> sitä 3D:ssä. Ovien avautumiskulman voi myös antaa ominaisuuksissa.</li><li><b>Valitse osa:</b> klikkaa kohdetta, ja klikkaa uudelleen osaa (esim. laatikkoa), niin sen asetukset aukeavat.</li></ul><h4>🚶 Kävely</h4><ul><li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> tai nuolet liikkuvat, <kbd>Shift</kbd> nopeuttaa, <kbd>Q</kbd>/<kbd>E</kbd> kääntää 45°.</li><li>Vedä hiirellä katsoaksesi, klikkaa lattiaa mennäksesi sinne. <kbd>Esc</kbd> lopettaa.</li><li>Portaita pitkin pääsee toiseen kerrokseen. Sijaintisi näkyy 2D-pohjassa sinisenä pisteenä.</li></ul>`],
 ['valo','Valaistus',`<h3>Valaistus ja aurinko</h3><ol><li>Paina 3D:n alareunasta <b>☀ Valaistus</b>.</li><li>Ruksaa <b>Aurinko ja vuorokaudenaika</b>.</li><li>Valitse päivä (tai Kevät/Kesä/Syksy/Talvi) ja vedä kellonaikaa. ▶ kelaa koko päivän.</li><li><b>Valaisimet päällä</b> sytyttää lamput ja valaisinpisteet.</li><li>Sijainti (oletus Calpe) ja pohjoinen säädetään samasta paneelista. Pohjoisen voi kääntää myös 2D:n kompassista.</li></ol><h4>Auringonvalo pinnalla</h4><p>Valitse työtaso, pöytä, lattia, terassi tai allas ja paina <b>Auringonvalo valitulle pinnalle</b>. Saat kellonajat, jolloin aurinko osuu siihen tai se on varjossa, sekä lämpökartan. <b>Vuodenajat</b> laskee neljä päivää kerralla.</p><p>Paneelin saa piiloon painamalla ☀ Valaistus uudelleen. Aurinko jää silloin päälle. Tasainen valo palaa, kun ruksi poistetaan.</p>`],
 ['kirjasto','Kirjasto',`<h3>Kirjasto</h3><ul><li>Kategoriat avautuvat klikkaamalla. Hakukenttä etsii nimellä.</li><li><b>Klikkaa</b> lisätäksesi näkymän keskelle tai <b>vedä</b> 2D- tai 3D-näkymään. Kun pudotat seinän viereen, kohde kääntyy seinää vasten.</li><li><b>+ Lisää kuvasta:</b> omat kalusteet kuvasta, sekä Seinät, Lattiat ja Katot -kohdissa pintamateriaali valokuvasta (laatta, rappaus…).</li><li><b>Materiaalit:</b> klikkaa materiaalia, kun kohde on valittuna, tai vedä se kohteen päälle 3D:ssä.</li><li>Omat elementit voi poistaa roskakorista tai Projekti › Hallitse ja poista.</li></ul>`],
 ['kerrokset','Kerrokset ja portaat',`<h3>Kerrokset ja portaat</h3><ul><li>Pohjan otsikkorivin <b>+</b> lisää kerroksen. Voit kopioida seinät ja huoneet nykyisestä kerroksesta.</li><li><b>⚙</b> avaa kerrosten tasot, kerroskorkeudet ja huonekorkeudet.</li><li>Alakerta näkyy pohjassa haaleana, joten yläkerran voi piirtää sen päälle.</li><li><b>Portaat</b> (Kirjasto › Rakenteet › Portaat) laskevat nousun automaattisesti seuraavaan kerrokseen ja tekevät porrasaukon.</li><li>3D:ssä valinta <i>tämä ja alemmat / kaikki / vain tämä</i> kerrosrivin lopussa.</li></ul>`],
 ['mep','Sähkö ja LVI',`<h3>Sähkö- ja LVI-pisteet</h3><ul><li>Ruksaa yläpalkista <b>Sähkö ja LVI</b>, niin pisteet näkyvät ja kalusteet haalistuvat.</li><li>Lisää pisteitä kirjastosta (Sähkö ja LVI). Piste kiinnittyy lähimpään seinään ja liukuu sitä pitkin.</li><li>Ominaisuuksissa: laji, korkeus lattiasta, määrä, huomio ja kannen väri. Valaisinpisteelle valovirta ja värilämpötila.</li><li>PDF:ssä <i>Sähkö- ja LVI-pohja</i> numeroituine pisteluetteloineen sekä pisteet seinäkuviin.</li></ul>`],
 ['tallennus','Tallennus ja tiedostot',`<h3>Tallennus</h3><ul><li><b>Tallenna</b> (<kbd>Ctrl</kbd>+<kbd>S</kbd>) tallentaa sinne, minne viimeksi tallensit.</li><li><b>Tallenna nimellä</b> (<kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd>): valitse <i>Sovelluksen projekteihin</i> (näkyy Avaa-listassa) tai <i>Tiedostoon</i> (valitset kansion Chromessa/Edgessä, muuten Lataukset-kansio).</li><li><b>Avaa</b>: tallennetut projektit tai <i>Avaa tiedostosta…</i>.</li><li>Viimeisimmän tallennuksen paikka näkyy, kun viet hiiren projektin nimen päälle.</li><li><b>Uusi</b> tyhjentää piirustuksen, kirjasto säilyy.</li></ul>`],
 ['pdf','PDF ja DXF',`<h3>PDF-tuloste</h3><p>Paina <b>PDF</b> ja valitse sivut: pohjapiirros, 3D-näkymät (myös neljästä kulmasta ja eri kellonaikoina), seinäkuvat kaappimitoilla, sähkö- ja LVI-pohja sekä määrät. Tuloste koskee valittua kerrosta.</p><h3>DXF</h3><ul><li><b>DXF</b>-painike vie valitun kerroksen pohjan CAD-ohjelmiin (millimetreinä, tasoina SEINAT, AUKOT, KALUSTEET, PORTAAT, PISTEET, PIHA, HUONEET, MITAT).</li><li><b>Pohjakuva</b> tai Projekti › <b>Tuo DXF</b> tuo arkkitehdin DXF:n taustaksi. Piirrä seinä, Uusi huone ja Mittaa kohdistuvat sen kulmiin. Tasot, yksikkö ja sijainti säädetään Projekti-välilehdellä.</li></ul>`],
 ['nappain','Pikanäppäimet',`<h3>Pikanäppäimet</h3><ul><li><kbd>Ctrl</kbd>+<kbd>Z</kbd> kumoa, <kbd>Ctrl</kbd>+<kbd>Y</kbd> tee uudelleen</li><li><kbd>Ctrl</kbd>+<kbd>S</kbd> tallenna, <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> tallenna nimellä</li><li><kbd>Ctrl</kbd>+<kbd>D</kbd> monista, <kbd>R</kbd> kierrä, <kbd>Delete</kbd> poista</li><li><kbd>M</kbd> mittaa, <kbd>Esc</kbd> lopeta työkalu tai kävely</li><li><kbd>Alt</kbd> vedettäessä ohittaa kohdistuksen, <kbd>Shift</kbd> mittauksessa lukitsee suoraan kulmaan</li><li>Mittakentissä ↑ ↓ muuttavat arvoa 10 mm (<kbd>Shift</kbd>: 100 mm)</li></ul>`]];

 box.querySelectorAll('[data-crot]').forEach(b=>b.onclick=()=>rotateCam(+b.dataset.crot));$('#znBtn').onclick=()=>zonePick?zoneStop():zoneStart('wand',sel()&&sel().type==='wall'?sel().id:null);box.querySelectorAll('[data-zm]').forEach(b=>b.onclick=()=>zoneStart(b.dataset.zm,zonePick&&zonePick.wid));{const d=$('#zDone');if(d)d.onclick=zoneFinishPoly;const st=$('#zStop');if(st)st.onclick=zoneStop}$('#lgBtn').onclick=()=>{lightOpen=!lightOpen;renderLightPanel();renderCamBtns()};$('#wkBtn').onclick=()=>walk.on?walkStop():walkStart();$('#phBtn').onclick=photoDialog;$('#aiBtn').onclick=aiDialog;$('#opBtn').onclick=()=>{openCabs=!openCabs;rebuild3D();renderCamBtns()};box.querySelectorAll('[data-cam]').forEach(b=>b.addEventListener('click',()=>{if(walk.on)walkStop()},true));
 box.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>{camKey=b.dataset.cam;camKey==='sketch'?setCam('sketch'):wallCam(S.objects.find(o=>o.id===camKey));renderCamBtns()})}
/* kierrä 3D-kameraa 90° kohteen ympäri */
function rotateCam(d){if(!camera)return;const t=controls.target,dx=camera.position.x-t.x,dz=camera.position.z-t.z,a=-d*PI/2,c=Math.cos(a),sn=Math.sin(a);
 camera.position.x=t.x+dx*c-dz*sn;camera.position.z=t.z+dx*sn+dz*c;controls.update();render3D()}
/* kamera huoneen sisälle seinää vastapäätä */
function wallCam(w){if(!w||!camera)return;const T=Math.max(0.05,w.T),p=toWorld(w,w.L/2,T),c=Math.cos(w.rot*D2R),sn=Math.sin(w.rot*D2R),n=[-sn,c];
 const f=roomFloor(w.room);let dmax=4;if(f){dmax=0;for(const[u,v]of[[0,0],[f.W,0],[f.W,f.D],[0,f.D]]){const q=toWorld(f,u,v);dmax=Math.max(dmax,(q[0]-p[0])*n[0]+(q[1]-p[1])*n[1])}}
 const aspect=camera.aspect||1.4,d=Math.max(1.0,dmax-0.12),hHalf=Math.atan((w.L/2+0.15)/d),vfov=2*Math.atan(Math.tan(hHalf)/aspect)/D2R,H=w.H||S.settings.roomH||2.5;
 camera.fov=clamp(Math.max(vfov,2*Math.atan((H/2+0.1)/d)/D2R),45,80);camera.updateProjectionMatrix();
 camera.position.set(p[0]+n[0]*d,Math.min(1.55,H*0.62),p[1]+n[1]*d);controls.target.set(p[0],H*0.48,p[1]);controls.update();render3D()}

 if((e.ctrlKey||e.metaKey)&&!typing){const k=e.key.toLowerCase();if(k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(k==='y'){e.preventDefault();redo()}else if(k==='d'){e.preventDefault();act('dup')}return}
 if(typing)return;

 if(e.key==='Enter'&&mode==='fzone'&&fzPick&&fzPick.mode==='poly'){fzFinish();return}
 if(e.key==='Enter'&&mode==='area'){finishArea();return}
 if(e.key.startsWith('Arrow')&&mode==='select'&&!walk.on){const o=sel();if(o&&!selOp&&!['floor','ceiling'].includes(o.type)||(o&&o.type==='floor')){e.preventDefault();const st=e.shiftKey?0.1:0.01,sd={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key],c=S2W(100,100),q=S2W(100+sd[0]*50,100+sd[1]*50),L=Math.hypot(q[0]-c[0],q[1]-c[1])||1,dx=(q[0]-c[0])/L*st,dy=(q[1]-c[1])/L*st;
  pushUndo();const ox=o.x,oy=o.y,F=captureFollow(o),wj=o.type==='wall'?bodyJoints(o):null;o.x=Math.round((o.x+dx)*1000)/1000;o.y=Math.round((o.y+dy)*1000)/1000;kidsOf(o).forEach(c=>{c.x+=o.x-ox;c.y+=o.y-oy});applyFollow(o,F);if(wj){applyBodyJoints(o,ox,oy,wj);wallsChanged()}dirty({posOnly:true});return}}
 if(e.key==='Escape'){if(calib){calib=null;updateHint();drawPlan()}else if(mode!=='select')setMode('select');else select(null)}
 if((e.key==='Delete'||e.key==='Backspace')&&selDim){e.preventDefault();delDim();return}
 if(e.key==='Enter'&&mode==='measure'&&meas&&meas.b){e.preventDefault();saveMeasure();return}
 if(e.key==='m'||e.key==='M'){setMode(mode==='measure'?'select':'measure');return}
 if((e.key==='Delete'||e.key==='Backspace')&&selId){e.preventDefault();act('del')}
 if(e.key==='r'||e.key==='R')act('rot')});
